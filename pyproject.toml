[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pllm"
version = "0.1.0"
description = "Protective MLLM - Aligning Multimodal Large Language Models for Safe Outputs"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
keywords = ["multimodal", "llm", "alignment", "dpo", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "datasets>=2.14.0",
    "pillow>=10.0.0",
    "numpy==1.26.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "wandb>=0.15.0",
    "trl>=0.7.0",
    "peft>=0.6.0",
    "bitsandbytes>=0.41.0",
    "deepspeed>=0.12.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "tensorboard>=2.14.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
pllm-train = "pllm.train.cli:main"
pllm-preprocess = "pllm.data.cli:main"
pllm-evaluate = "pllm.evaluation.cli:main"
pllm-infer = "pllm.inference.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/pllm"
Documentation = "https://pllm.readthedocs.io"
Repository = "https://github.com/yourusername/pllm"
Issues = "https://github.com/yourusername/pllm/issues"

[tool.setuptools]
packages = ["pllm"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pllm = ["py.typed", "configs/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/pllm --cov-report=html --cov-report=term-missing"
